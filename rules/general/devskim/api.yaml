  - cpp
  - objective-c
- id: devskim-DS154193
  description: 'Objective-C method swizzling detected: class_addMethod and class_replaceMethod rewrite the method table at
    runtime. The SDL lists both as banned because the result depends on load order, silently changes behaviour for every caller
    of the affected selector, and is difficult to reason about or review. Recommendation: Prefer subclassing, categories that
    add rather than replace behaviour, or an explicit delegate.'
  severity: medium
  category: sast
  confidence: low
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
  regex: (?:\b(?:(class_addMethod|class_replaceMethod))\b)
  languages:
  - objective-c
