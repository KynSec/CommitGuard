name: Native binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pyinstaller

      - name: Build standalone binary
        run: python scripts/build_native.py --output-dir dist/native

      - name: Smoke test
        shell: bash
        run: |
          if [ -f dist/native/commit-guard.exe ]; then
            ./dist/native/commit-guard.exe --version
          else
            ./dist/native/commit-guard --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: commit-guard-native-${{ matrix.os }}
          path: dist/native/commit-guard*
          if-no-files-found: error
