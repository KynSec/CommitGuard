# nuclei-style file template: connection strings with embedded credentials.
# Commit Guard supports the `file:` -> matchers/extractors -> regex shape
# without running the nuclei engine. Capture group 1 is treated as the
# secret and masked in reports.
id: exposed-connection-string

info:
  name: Exposed database connection string
  description: >-
    A database or message-broker connection URI with an embedded password was
    committed to the repository.
  severity: high
  tags: secret, credentials, database

file:
  - extensions:
      - all
    matchers:
      - type: regex
        regex:
          - '(?i)\b(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|redis|rediss|amqp|amqps)://[^:\s/@]+:([^@\s/"]{3,})@'
    extractors:
      - type: regex
        regex:
          - '(?i)\b(?:authorization|bearer)\s*[:=]\s*(?:bearer\s+)?([A-Za-z0-9._~+/=-]{20,})'
