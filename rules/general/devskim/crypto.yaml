- id: devskim-DS114352
  description: 'Encryption marked optional: The connection string leaves transport encryption optional or disables certificate
    validation. Encrypt=False sends credentials and data in the clear, and TrustServerCertificate=True encrypts but accepts
    any certificate, so the connection is not authenticated and can be intercepted. The PostgreSQL and MySQL modes prefer,
    allow and disable all fall back to plaintext without error. Recommendation: Require encryption and validate the certificate:
    Encrypt=True with TrustServerCertificate=False, or sslmode=verify-full.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - crypto
  - cryptography.protocol.tls
  regex: (?:(?i)((?i:Encrypt\s*=\s*(false|no|0)\b|TrustServerCertificate\s*=\s*(true|yes|1)\b)|sslmode\s*=\s*(prefer|allow|disable)\b|SslMode\s*=\s*(Preferred|None)\b|useSSL\s*=\s*false\b))
