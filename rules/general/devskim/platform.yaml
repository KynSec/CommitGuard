  description: 'Do not store sensitive data in NSUserDefaults.: Do not store sensitive data in NSUserDefaults. Recommendation:
    Consider another mechanism instead.'
  severity: medium
  category: sast
  confidence: medium
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - storage.apple.ios.userdefaults.sensitivedata
  regex: (?:NSUserDefaults \*(.*) = \[NSUserDefaults standardUserDefaults\];(\n.*){1,5}\1 .*set(?:Object|Value):(password|key))
