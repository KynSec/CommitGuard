[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-guard"
dynamic = ["version"]
description = "Fast, offline-first local security control plane for secrets, SAST, dependencies, and policy gating."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
authors = [{name = "Amr Khaled Ahmed", email = "amr171516@gmail.com"}]
keywords = ["security", "appsec", "secrets", "sast", "sca", "offline-first", "sarif", "policy-as-code", "pre-commit", "github-actions"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
commit-guard = "install_hook:main"
commit-guard-scan = "main:main"
commit-guard-gui = "gui_server:main"

[project.urls]
Homepage = "https://github.com/CommitGuard-Sec/CommitGuard"
Documentation = "https://github.com/CommitGuard-Sec/CommitGuard#readme"
Repository = "https://github.com/CommitGuard-Sec/CommitGuard"
Issues = "https://github.com/CommitGuard-Sec/CommitGuard/issues"
Changelog = "https://github.com/CommitGuard-Sec/CommitGuard/blob/main/CHANGELOG.md"
Security = "https://github.com/CommitGuard-Sec/CommitGuard/security/policy"

[tool.setuptools]
py-modules = ["main", "install_hook", "gui_server", "gui_actions", "gui_page"]
packages = ["core", "core.engines", "rules", "rules.ai_security", "rules.iac"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "core.__version__"}

[tool.setuptools.package-data]
rules = ["*.toml", "*.yaml", "*.yml", "**/*.toml", "**/*.yaml", "**/*.yml"]

[tool.setuptools.exclude-package-data]
# Semgrep Rules License v1.0 forbids redistribution. The packs stay in the
# source tree for local development only until the license review clears them.
rules = ["semgrep_rules/*", "semgrep_rules/**/*"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
