- id: devskim-DS425050
  description: 'Do not deserialize untrusted data.: torch.load, joblib.load and dill.load execute arbitrary code while deserializing.
    marshal does not execute the reconstructed object, but it is documented as unsafe for untrusted or malformed input, which
    can crash the interpreter. ADM.10010 names these explicitly for AI model files obtained from public sources such as GitHub
    or Hugging Face. Recommendation: Load model weights with a format that does not execute code, such as safetensors, or
    verify provenance and load only in a sandbox.'
  severity: medium
  category: sast
  confidence: low
  source: devskim
  tags:
  - general
  - devskim
  - api
  - deserialization
  regex: (?:(torch|joblib|dill|marshal)\.loads?\s*\()
  languages:
  - python
- id: devskim-DS425070
  description: 'Do not deserialize untrusted data.: BinaryFormatter, SoapFormatter, NetDataContractSerializer, LosFormatter
    and ObjectStateFormatter reconstruct arbitrary types named in the payload, which allows an attacker who controls the input
    to run code. ADM.10010 approves only System.Text.Json, XmlSerializer, DataContractSerializer, DataContractJsonSerializer,
    Newtonsoft.Json and protobuf. Recommendation: Use System.Text.Json or another approved serializer. BinaryFormatter is
    obsolete and was removed in .NET 9.'
  severity: critical
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - deserialization
  regex: (?:\b(?:(BinaryFormatter|SoapFormatter|NetDataContractSerializer|LosFormatter|ObjectStateFormatter))\b)
  languages:
  - csharp
  - razor
  - fsharp
  - vb
- id: devskim-DS425080
  description: 'Do not deserialize untrusted data.: JavaScriptSerializer stopped being an approved safe deserializer on 2023-03-10.
    With a type resolver such as SimpleTypeResolver it reconstructs types named in the payload, which allows code execution.
    Recommendation: Use System.Text.Json. If JavaScriptSerializer cannot be removed, never construct it with a JavaScriptTypeResolver.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - deserialization
  regex: (?:\b(?:(JavaScriptSerializer|SimpleTypeResolver))\b)
  languages:
  - csharp
  - razor
  - fsharp
  - vb
- id: devskim-DS425090
  description: 'Do not deserialize untrusted data.: ADM.10010 approves Boost but singles out Boost Property Tree, whose JSON
    and XML readers have known denial-of-service behaviour on deeply nested payloads because they recurse without a depth
    limit. Recommendation: Use nlohmann/json, or bound both input size and nesting depth before parsing.'
  severity: medium
  category: sast
  confidence: low
  source: devskim
  tags:
  - general
  - devskim
  - api
  - deserialization
  regex: (?:boost::property_tree\b|\b(?:read_json|read_xml)\s*\()
  languages:
  - c
  - cpp
