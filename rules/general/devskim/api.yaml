- id: devskim-DS181021
  description: 'Banned C function detected (gets): gets will read in as many bytes as are provided, regardless of the size
    of buffer recieving the bytes. This allows for conditions that cause a buffer overlow in the destination buffer. Recommendation:
    Use gets_s or fgets if possible. fgets has different behavior from gets (may include newline for example), so care should
    be taken if it is used.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
  regex: (?:\bgets\s*\(([^,\)]+)\))
  languages:
