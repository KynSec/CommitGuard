  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - implementation.mobile.ios.dataprotection.privacy.udid
  regex: (?:uniqueIdentifier)
  languages:
  - objective-c
- id: devskim-DS117838
  description: 'Do not store tokens or keys in source code.: A token or key was found in source code. If this represents a
    secret, it should be moved somewhere else.'
  severity: critical
  category: secret
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - implementation.privacy.token
  regex: (?:(secret|license|key|pass).*[a-f0-9]{30,})
  languages:
  - code
  secret: true
- id: devskim-DS173238
  description: 'Private key material committed to source: A PEM-encoded private key block is present in source. A private
    key in a repository must be treated as compromised: it is readable by everyone with repository access, it persists in
    git history after deletion, and it is copied to every clone and fork. Recommendation: Remove the key, rotate it, and load
    the replacement from Key Vault or the platform certificate store at runtime.'
  severity: critical
  category: secret
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - cryptography.keymanagement
  regex: (?:-----BEGIN\s+((RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED)\s+)?PRIVATE KEY( BLOCK)?-----)
  languages:
  - code
  secret: true
- id: devskim-DS173239
  description: 'Provider access token committed to source: A token matching a well-known provider format is present in source.
    These prefixes are assigned by the issuing provider and are not produced by ordinary code, so a match is almost always
    a live credential. Recommendation: Remove and rotate the token immediately, then obtain credentials at runtime from Key
    Vault or a managed identity.'
  severity: critical
  category: secret
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - authentication.token
  regex: (?:(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}))|(?:(?i:(?:aws_?)?secret_?access_?key)["']?\s*[:=]\s*["']?[A-Za-z0-9/+]{40}(?![A-Za-z0-9/+=]))|(?:AIza[0-9A-Za-z_\-]{35})|(?:xox[abprs]-[0-9A-Za-z-]{10,})|(?:(sk|rk)_live_[0-9A-Za-z]{16,})|(?:npm_[A-Za-z0-9]{36})|(?:SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43})|(?:glpat-[A-Za-z0-9_\-]{20})
  languages:
  - code
  secret: true
- id: devskim-DS173240
  description: 'Azure storage account key committed to source: An Azure Storage connection string containing AccountKey, or
    a shared access signature, is present in source. An account key grants full control of the storage account, including
    deleting every container, and it cannot be scoped or revoked individually without rotating the whole account. Recommendation:
    Use a managed identity with DefaultAzureCredential. Where a key is unavoidable, store it in Key Vault and read it at runtime.'
  severity: critical
  category: secret
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - authentication.token
  regex: (?:AccountKey\s*=\s*[A-Za-z0-9+/]{64,}={0,2})|(?:(SharedAccessSignature|sig=)[A-Za-z0-9%+/]{40,})
  languages:
  - code
  secret: true
- id: devskim-DS112266
  description: 'ProtectedData used without additional entropy: The ProtectedData class should be used with additional entropy
    to reduce the risk of other application calling DPAPI to access the data. Recommendation: Add additional entropy (per-application
    secret).'
  severity: medium
  category: sast
  confidence: medium
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - storage.windows.dpapi
  regex: (?:ProtectedData\.Protect.*,\s*null.*)
  languages:
  - csharp
  - razor
  - fsharp
