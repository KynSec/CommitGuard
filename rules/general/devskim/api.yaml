  - cpp
  - objective-c
- id: devskim-DS154190
  description: 'Banned pointer validation function detected (IsBad*Ptr): The IsBad*Ptr family cannot reliably determine whether
    a pointer is valid. It works by triggering and swallowing access violations, which can corrupt the guard page of a thread
    stack, mask real defects, and still return the wrong answer for a pointer that becomes invalid immediately afterwards.
    Recommendation: Remove the check. Validate pointers by contract and structured design rather than by probing memory.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
  regex: (?:\b(?:(IsBadCodePtr|IsBadHugeReadPtr|IsBadHugeWritePtr|IsBadReadPtr|IsBadStringPtr|IsBadStringPtrA|IsBadStringPtrW|IsBadWritePtr))\b)
  languages:
  - c
  - cpp
  - objective-c
- id: devskim-DS154191
  description: 'Banned unbounded memory copy detected (CopyMemory): CopyMemory and RtlCopyMemory are Windows aliases for memcpy.
    They take a caller-supplied length and perform no bounds checking against the destination, so an incorrect length silently
    corrupts adjacent memory. Recommendation: Use memcpy_s, or a bounded copy that is given the size of the destination buffer.'
  severity: medium
  category: sast
  confidence: medium
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
  regex: (?:\b(?:(CopyMemory|RtlCopyMemory))\b)
  languages:
  - c
  - cpp
  - objective-c
- id: devskim-DS154192
  description: 'Banned unbounded string length function detected: strlen and lstrlen read until they find a terminator. If
    the buffer is not terminated within its allocation they read past the end of it. Recommendation: Use strnlen_s, or another
    length function that is given the size of the buffer.'
  severity: low
  category: sast
  confidence: low
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
  regex: (?:\b(?:(_tcslen|lstrlen|lstrlenA|lstrlenW|strlen|wcslen))\b)
