- id: devskim-DS144886
  description: '$_REQUEST should be avoided: $_REQUEST combines POST, GET, and cookie values in one array, making it easy
    for an attacker to modify a POST or cookie value by instead putting it in a GET and sending the URL to the victim Recommendation:
    Use $_POST, $_GET, $_COOKIE to scope to the expected delivery method for a value'
  severity: medium
  category: sast
  confidence: medium
  source: devskim
  tags:
  - general
  - devskim
  - platform
  - implementation.php
  regex: (?:\$_REQUEST)
  languages:
  - php
