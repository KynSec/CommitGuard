name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependency
        run: python -m pip install pyyaml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              Path("core/__init__.py").read_text(encoding="utf-8"),
          ).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if not version == tag:
              raise SystemExit(f"tag {tag} does not match core.__version__ {version}")
          print(f"release version: {version}")
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Build zipapp
        run: python scripts/build_zipapp.py --output dist/commit-guard.pyz

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build VS Code extension
        run: |
          npm ci --prefix editors/vscode
          npm run compile --prefix editors/vscode
          npm test --prefix editors/vscode
          npm run package --prefix editors/vscode
          cp editors/vscode/*.vsix dist/

      - name: Install wheel for artifact generation
        run: python -m pip install dist/*.whl

      - name: Generate SBOMs for CommitGuard
        run: |
          commit-guard sbom . --format cyclonedx --output dist/commit-guard.cdx.json --project-name commit-guard
          commit-guard sbom . --format spdx --output dist/commit-guard.spdx.json --project-name commit-guard

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY_B64:-}" ]; then  # commit-guard-ignore: use-escapexml
            echo "::notice::RELEASE_SIGNING_KEY_B64 is not configured; checksums are unsigned."
            exit 0
          fi
          printf '%s' "$RELEASE_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/release-signing-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-signing-key.pem" \
            -out dist/SHA256SUMS.sig dist/SHA256SUMS
          openssl dgst -sha256 -verify <(
            openssl pkey -in "$RUNNER_TEMP/release-signing-key.pem" -pubout
          ) -signature dist/SHA256SUMS.sig dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release-signing-key.pem"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/commit-guard.pyz
            dist/*.vsix

      - name: Build container image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"  # commit-guard-ignore: use-escapexml
          docker build -t "$image:${GITHUB_REF_NAME}" -t "$image:latest" .

      - name: Publish container image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"  # commit-guard-ignore: use-escapexml
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin  # commit-guard-ignore: use-escapexml
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commit-guard-release
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
