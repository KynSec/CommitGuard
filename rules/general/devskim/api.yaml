    the source is larger than the destination. Recommendation: Use strcpy_s or strlcpy if possible. If no safe function is
    viable, strcpy/strncpy should be proceeded by conditional checks to verify that the source string will fit in the destination
    with a null termnator.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
