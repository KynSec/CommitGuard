- id: devskim-DS108330
  description: 'Banned C function detected (strncat): strncat adds the null terminator at character ''n + 1'', rather than
    at the nth character. this frequently leads to the null terminator being added in the memory adjacent to the destination
    buffer, rather than in the destination buffer. Recommendation: Use strcat_s or strlcat if possible.'
  severity: high
  category: sast
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - api
  - api.dangerousapi.bannedfunction
