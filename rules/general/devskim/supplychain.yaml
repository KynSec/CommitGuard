- id: devskim-DS205001
  description: 'Additional package index configured: ADM.10205 states that --extra-index-url and PIP_EXTRA_INDEX_URL must
    not be used. pip treats every extra index as equal in priority to the primary one, so an attacker who publishes a higher
    version of an internal package name on a public index can have it installed instead. Recommendation: Use a single --index-url
    pointing at your Azure Artifacts feed, and configure public packages as an upstream source on that feed.'
  severity: high
  category: supply-chain
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - supplychain
  - supplychain.packagesource
  regex: (?:(--extra-index-url|PIP_EXTRA_INDEX_URL|extra-index-url\s*=))
  languages:
  - python
  - shellscript
  - powershell
  - yaml
  - dotenv
  - dockerfile
  - pip-requirements
  - pip-config
  - .config
