- id: devskim-DS132782
  description: 'Do not enable external entity resolution.: DtdProcessing.Parse, or ProhibitDtd set to false, allows the XML
    parser to process a DTD. A DTD can declare external entities that read local files or make network requests, and can expand
    recursively to exhaust memory. Recommendation: Set DtdProcessing to Prohibit, as shown in the worked example in ADM.10010.'
  severity: high
  category: web
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - web
  - xml.xxe
  regex: (?:DtdProcessing\s*(?:[=.]|<-)\s*(DtdProcessing\s*\.\s*)?Parse)|(?:(?i)ProhibitDtd\s*(?:=|<-)\s*false)
  languages:
  - csharp
  - razor
  - fsharp
  - vb
- id: devskim-DS132783
  description: 'Do not enable external entity resolution.: Assigning an XmlResolver lets the parser follow external references
    in the document, including file:// and http:// URIs. ADM.10010''s worked example sets XmlResolver to null. Recommendation:
    Set XmlResolver to null, or leave it unset on frameworks where the default is already null.'
  severity: high
  category: web
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - web
  - xml.xxe
  regex: (?:(?i)XmlResolver\s*(?:=|<-)\s*new\s+Xml(Url|Secure)Resolver)
  languages:
  - csharp
  - razor
  - fsharp
  - vb
- id: devskim-DS132785
  description: 'Do not enable external entity resolution.: libxml_disable_entity_loader(false) re-enables the external entity
    loader, which allows a document to read local files through the file:// scheme. Recommendation: Leave the entity loader
    disabled. On libxml2 2.9 and later it is off by default, so the call is usually unnecessary.'
  severity: high
  category: web
  confidence: high
  source: devskim
  tags:
  - general
  - devskim
  - web
  - xml.xxe
  regex: (?:libxml_disable_entity_loader\s*\(\s*(false|FALSE|0)\s*\))|(?:\b(?:LIBXML_NOENT)\b)
  languages:
  - php
- id: devskim-DS132786
  description: 'Do not enable external entity resolution.: lxml resolves entities when resolve_entities is left enabled or
    a DTD is loaded, which allows a document to read local files or reach network resources. Recommendation: Construct the
    parser with resolve_entities=False, no_network=True, and load_dtd=False.'
  severity: medium
  category: web
  confidence: low
  source: devskim
  tags:
  - general
  - devskim
  - web
  - xml.xxe
  regex: (?:\b(?:(resolve_entities|load_dtd)\s*=\s*True|no_network\s*=\s*False)\b)
  languages:
  - python
